[package]
name = "omni-ring"
description = "Wait-free bounded SPSC descriptor ring and lock-free bounded MPMC ring (REQ-OS-001)."
# 0.2.0: adds SlotTable<T, N> (the typed-payload follow-up). The
# workspace version stays 0.1.0 for the other crates; omni-ring
# overrides until the whole workspace ships a release train together.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
crossbeam-queue = { workspace = true, optional = true }
loom = { version = "0.7", optional = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[features]
default = ["mpmc"]
# Lock-free MPMC via crossbeam (std). The no_std/no-alloc kernel build
# opts out and uses the SPSC ring only (ADR-0013).
mpmc = ["dep:crossbeam-queue"]
# Model-checking double for CI's loom leg (estate rust-kit `loom: true`).
loom = ["dep:loom"]

[[bench]]
name = "ring"
harness = false
